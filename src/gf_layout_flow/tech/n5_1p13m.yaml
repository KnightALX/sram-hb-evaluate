# ---------------------------------------------------------------------------
# L2 interconnect analysis (pi-ladder + Elmore) — user-approved model
# Primary delay estimate for GDS WL analysis. L3 (Palace EM) is future only.
# ---------------------------------------------------------------------------
analysis_l2:
  model: pi_ladder_elmore
  seg_length_default_um: 0.5   # = WL tap pitch
  R_drv_ohm: 200.0
  R_drv_source: placeholder_unverified
  R_drv_note: "D10 driver series Rout placeholder — NOT SPICE-calibrated; replace after inverter characterization"
  C_drv_par_ff: 0.0
  C_drv_par_note: "Optional driver parasitic at node0; default 0"
  C_pg_ff_per_finger: 0.3
  C_pg_ff: 0.3
  C_pg_source: user_rule_0p3fF_per_finger
  C_pg_note: "C_pg = 0.3 fF × nfinger_pg (user); default PG nfinger=1 -> 0.3 fF; dual-PG tap = 2×0.3 = 0.6 fF"
  n_pg_default: 2
  Vdd_V: 0.75
  Vdd_source: placeholder_unverified
  Vdd_note: "N5 core Vdd placeholder for energy proxy 0.5*C*Vdd^2 (fJ when C in fF)"
  via_c_from_ladder: true
  note_zh: |
    L2 主模型：按 tap pitch 分段的 pi-ladder + Elmore 延时。
    仅 R_drv / Vdd 仍为占位，需用户用 SPICE / 实测校准；C_pg 使用用户 finger 规则：0.3 fF × nfinger_pg。
    L3（Palace 等）仅作抽样校准，本版本不实现。
  future_l3: |
    Future L3: sample segments with Palace (or similar EM) to calibrate
    R'/C' and via lumps; do not replace L2 for full-array sweeps until
    calibrated. Not implemented in this release.
