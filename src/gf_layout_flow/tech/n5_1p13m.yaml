# ---------------------------------------------------------------------------
# Analytical interconnect RC lookup (user-measured table — do not invent values)
# 用户实测互连 RC 查表；表中未列的 Metal 按金属序号在相邻已给层之间折算：
#   R 用对数平均 R = sqrt(R_lo * R_hi)；C 用算术平均 C = (C_lo + C_hi)/2
# M0：无更密邻层，映射为 M1（source=extrapolated / mapped_to_M1）
# M12/M13：实测表止于 M11，映射为 M11
# AP：无邻层可折算，留空（loader 返回 null / skip）
# Via / HB：按实例（按个）；分析默认电容用 C（非 C+cc），仍存 c_plus_cc_ff
# ---------------------------------------------------------------------------
interconnect_rc:
  units:
    r_metal: Ohm/um
    c_metal: fF/um
    r_lumped: Ohm
    c_lumped: fF
  note_zh: |
    用户实测查表（Metal 每微米 R/Ctotal，另存 width/space/Cc/Cbottom/Ctop；
    Via 类与 HB 为按实例集总，默认电容用 C 非 C+cc）。
    表中未列 Metal（含 M2/M0/M4…）由相邻已给层折算：R=sqrt 对数平均，C=线性平均。
    实测表止于 M11：M12/M13 映射到 M11。VIA0 不在表中，按薄 via 映射到 V1-V2。
    本表为研究用解析 RC，不是 foundry 提取结果。
  interpolation_notes:
    rule_r: "log-average: R = sqrt(R_lo * R_hi) between nearest tabulated metal indices"
    rule_c: "linear-average: C = (C_lo + C_hi) / 2"
    m0: "extrapolated / mapped_to_M1 (no denser tabulated neighbor below M1)"
    m12_m13: "mapped_to_M11 (measured table ends at M11; nearest tabulated above)"
    ap: "null — skip unless a tabulated neighbor exists"
    measured_source: "user_measured_lookup"
    interpolated_source: "interpolated_from_user_measured"
    via_default: "default thin via class V1-V2: R=30 Ohm, C=0.1 fF per instance (analysis uses C not C+cc)"
    via_classes: "V1-V2 / V3-V4 / V5-V9 / V10-V11 measured; VIA0→V1-V2 mapped; VIA12→V10-V11 mapped"
    capacitance_default: "use C (c_ff) for analysis; c_plus_cc_ff stored for reference"
  metals_per_um:
    M0:
      r_ohm_per_um: 60.0
      c_ff_per_um: 0.22
      width_um: 0.021
      space_um: 0.021
      Cc: 0.0857
      Cbottom: 0.0645
      Ctop: 0.034
      source: extrapolated
      mapped_to: M1
      parents: [M1]
      note: "No denser tabulated neighbor; use M1 measured values (map M0→M1)"
    M1:
      r_ohm_per_um: 60.0
      c_ff_per_um: 0.22
      width_um: 0.021
      space_um: 0.021
      Cc: 0.0857
      Cbottom: 0.0645
      Ctop: 0.034
      source: user_measured_lookup
    M2:
      r_ohm_per_um: 32.863353450309965
      c_ff_per_um: 0.215
      source: interpolated_from_user_measured
      parents: [M1, M3]
      note: "R=sqrt(R_M1*R_M3); C=(C_M1+C_M3)/2"
    M3:
      r_ohm_per_um: 18.0
      c_ff_per_um: 0.21
      width_um: 0.021
      space_um: 0.021
      Cc: 0.0874
      Cbottom: 0.0356
      Ctop: 0.0336
      source: user_measured_lookup
    M4:
      r_ohm_per_um: 11.224972160321824
      c_ff_per_um: 0.185
      source: interpolated_from_user_measured
      parents: [M3, M5]
      note: "R=sqrt(R_M3*R_M5); C=(C_M3+C_M5)/2"
    M5:
