  OD_12: { cad: 8, datatype: 0,   role: thick_oxide_alias, source: placeholder_unverified, verify_against: T-N05-CL-LE-001, alias_of: OD2 }
  CM0:  { cad: 29, datatype: 0,   role: cut_m0,        source: placeholder_unverified, verify_against: T-N05-CL-LE-001 }
