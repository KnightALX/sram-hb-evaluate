  note: "Registered in active LayerMap with placeholder CAD#; MUST verify before any foundry use."
  NW:   { cad: 1,  datatype: 0,   role: n_well,        source: placeholder_unverified, verify_against: T-N05-CL-LE-001 }
  DNW:  { cad: 3,  datatype: 0,   role: deep_n_well,   source: placeholder_unverified, verify_against: T-N05-CL-LE-001 }
