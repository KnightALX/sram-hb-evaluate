# TSMC N5 / N05 metallization option config for local BEOL/RC research.
# Derived from user-provided N5 DRM excerpts — NOT an official TSMC PDK.
# Do not redistribute DRM text/tables/PDFs.

stack_option: "1P13M_M1+1x1xb1xe1ya1yb3y2yy2z"
description: "FEOL/MEOL (OD/PO/MD/VG/VD/…) + M0..M13 + AP; HB overlays; NW/DNW/OD2/CM0* are placeholder_unverified (verify LE-001)"
dbu_um: 0.0005  # DRM recommends 0.5 nm DBU when streaming GDS
dbu_note: "Recommend 0.5 nm database unit (0.0005 µm) per N5 DRM DBU guideline."


# FEOL / MEOL drawing layers — CAD;DT confirmed from T-N05-CL-DR-014 (user DRM)
# min geom from DRM W/S or cross-section notes. Thickness = research_approx where not tabulated.
feol:
  OD:         { cad: 6,   datatype: 0,   role: active,        min_w_um: 0.034, min_s_um: 0.078, source: drm_ws }
  COD_H:      { cad: 6,   datatype: 60,  role: cut_od_h,      source: drm_cad }
  COD_V:      { cad: 6,   datatype: 61,  role: cut_od_v,      source: drm_cad }
  COD_BLOCK:  { cad: 6,   datatype: 70,  role: cut_od_block,  source: drm_cad }
  PO:         { cad: 17,  datatype: 0,   role: poly_gate,     min_w_um: 0.006, min_s_um: 0.045, source: drm_ws }
  CPO:        { cad: 17,  datatype: 30,  role: cut_poly,      source: drm_cad }
  PP:         { cad: 25,  datatype: 0,   role: pplus_implant, source: drm_cad }
  NP:         { cad: 26,  datatype: 0,   role: nplus_implant, source: drm_cad }
  NT_N:       { cad: 11,  datatype: 0,   role: well_block,    source: drm_cad }

meol:
  MD:   { cad: 82,  datatype: 150, role: local_interconnect, min_w_um: 0.020, min_s_um: 0.031, source: drm_ws }
  CMD:  { cad: 82,  datatype: 250, role: cut_md,             source: drm_cad }
  VG:   { cad: 178, datatype: 150, role: via_po_m0,          min_size_um: 0.012, pitch_um: 0.039, source: drm_ws }
  VD:   { cad: 179, datatype: 150, role: via_md_m0,          min_size_um: 0.014, pitch_um: 0.037, source: drm_ws }
  VDR:  { cad: 177, datatype: 150, role: rail_vd,            source: drm_cad }
  CB:   { cad: 76,  datatype: 0,   role: passivation_open,   source: drm_cad }
  CBD:  { cad: 169, datatype: 0,   role: passivation1,       source: drm_cad }
  CB2:  { cad: 86,  datatype: 0,   role: passivation2,       source: drm_cad }
  PM:   { cad: 5,   datatype: 0,   role: polyimide_open,     source: drm_cad }

